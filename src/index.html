<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1A435A"><title>DayBuoy · Inlet Beach</title><style>/* DAYBUOY_CSS */</style></head><body>
<main id="app" class="db-screen"><canvas id="ocean" aria-label="Live 3D Inlet Beach"></canvas><div class="sky-scrim"></div>
<div id="compass-strip" aria-label="True compass heading"></div><div id="solar-debug" class="glass" hidden></div><div id="facing-label" hidden></div><button id="sun-edge" class="glass" aria-label="Drag to explore the sun path" hidden></button><div id="release-hint" hidden>Release to return to the beach</div><button id="look-back" class="glass">Look back</button><header id="hero" class="db-head"><div class="db-row1"><div class="db-kicker"><span id="live-dot" class="db-dot away"></span><span id="source-label">Reading the Gulf…</span></div><button id="watch-day" class="db-play" aria-label="Watch the day" hidden></button><button id="back-to-now" class="db-now" hidden><i></i>Back to now</button><button id="retry-forecast" class="db-now" style="padding:0 14px" hidden>Retry</button></div><div id="story-progress" class="db-progress" role="progressbar" aria-label="Watch the day progress" hidden><i></i></div><div id="reference-banner" class="db-banner" role="status" hidden></div><div id="headline" class="db-verdict"></div><div class="db-meta"><span id="hero-temp" class="db-temp"></span><span id="story-detail" class="db-detail"></span></div><div id="reference-skeleton" hidden><div class="db-skel" style="margin-top:20px;width:230px;height:30px;background:rgba(255,255,255,.28)"></div><div class="db-skel" style="margin-top:10px;width:170px;height:30px;background:rgba(255,255,255,.28)"></div><div class="db-skel" style="margin-top:16px;width:200px;height:18px;background:rgba(255,255,255,.22)"></div></div></header><div id="reference-wash" class="db-loading-wash" hidden></div><div class="db-shade"></div><button id="reference-skypill" class="db-skypill" hidden></button>
<div id="path-labels" aria-hidden="true"></div><div id="watch-weather-note" hidden></div><button id="sun-handle" class="sun-handle" role="slider" aria-label="Beach time" aria-valuemin="0" aria-valuemax="1440"><i></i><span id="sun-time"></span></button>
<section id="glass-dock" class="db-dock" aria-label="Your beach forecast"><div class="db-tint"></div><div id="metrics" class="db-stats"></div><div class="db-hr"></div><div id="days" class="db-days" aria-label="Forecast day"></div><div id="week-scrubber" class="db-track" role="slider" tabindex="0" aria-label="Selected day, midnight to midnight"><div class="db-line week-track"></div><div class="db-tick" style="left:0%">12a</div><div class="db-tick" style="left:25%">6a</div><div class="db-tick" style="left:50%">12p</div><div class="db-tick" style="left:75%">6p</div><div class="db-tick" style="left:100%">12a</div><div class="db-nowtick week-now"></div><div class="db-thumb sun week-sun"></div><span class="day-marks" hidden></span></div><div class="db-act"><div id="moment-action" class="db-btn" role="button" tabindex="0"><span class="action-copy"></span><span class="go"></span></div><div id="share-scene" class="db-share" role="button" tabindex="0" aria-label="Share beach forecast"></div></div></section>
<section id="expanded-sheet" class="glass expanded-sheet" hidden aria-label="Conditions details"><button class="grab" aria-label="Close details"><i></i></button><button class="sheet-dismiss" aria-label="Close details">×</button><div id="sheet-content"></div></section>
<div hidden><button id="watch-close" hidden></button><p id="air-feel"></p><p id="forecast-status"></p><span id="scrub-time"></span></div><div id="notice" class="notice glass" hidden role="status"></div><div id="loading" class="loading"><div class="loading-lamp"></div><b>DayBuoy</b><span>Opening your beach</span></div>
</main><script>/* DAYBUOY_JS */</script></body></html>
