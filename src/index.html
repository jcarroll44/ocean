<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1A435A"><title>DayBuoy · Inlet Beach</title><style>/* DAYBUOY_CSS */</style></head><body>
<main id="app"><canvas id="ocean" aria-label="Live 3D Inlet Beach"></canvas><div class="sky-scrim"></div>
<header class="brandbar"><div class="brand"><svg viewBox="0 0 28 38" aria-hidden="true"><defs><linearGradient id="lamp" x2="0" y2="1"><stop stop-color="#fff7b8"/><stop offset="1" stop-color="#F3A43A"/></linearGradient></defs><ellipse cx="14" cy="30" rx="10" ry="3" fill="#f3a43a"/><path d="M4 34q10 5 20 0" fill="none" stroke="#f7c86c" stroke-width="2"/><path d="M11 13h6l2 15H9z" fill="url(#lamp)"/><rect x="10" y="5" width="8" height="13" rx="4" fill="url(#lamp)"/><circle cx="14" cy="3" r="2" fill="#fff4b3"/></svg><div><b>DayBuoy</b><span>Inlet Beach</span></div></div><button id="source-label" class="source-label" disabled>FORECAST</button></header>
<section id="hero" class="hero"><div id="hero-temp">—°</div><p id="headline">Your beach, by the hour</p></section>
<div id="path-labels" aria-hidden="true"></div><button id="sun-handle" class="sun-handle" role="slider" aria-label="Beach time" aria-valuemin="0" aria-valuemax="1440"><i></i><span id="sun-time"></span></button>
<section id="glass-dock" class="glass dock"><div id="days" class="days" aria-label="Forecast day"></div><div id="metrics" class="metrics"></div><button id="moment-action" class="amber-action"></button></section>
<section id="expanded-sheet" class="glass expanded-sheet" hidden aria-label="Conditions details"><button class="grab" aria-label="Close details"><i></i></button><div id="sheet-content"></div></section>
<div class="watch-controls glass"><button id="watch-day"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5 13 8 4 13.5z" fill="currentColor"/></svg>Watch the day</button><button id="watch-close" aria-label="Close playback" hidden>×</button></div><div id="notice" class="notice glass" hidden role="status"></div><div id="loading" class="loading"><div class="loading-lamp"></div><b>DayBuoy</b><span>Opening your beach</span></div>
</main><script>/* DAYBUOY_JS */</script></body></html>
