name: iPhone compile check
on:
  push:
    branches: [wip/tidewater-verdict-first]
    paths: ['native/**', 'src/**', 'ocean-proof/proof/**', 'production/**', 'scripts/**', '.github/workflows/ios-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix native
      - name: Build bundled app and validate contracts
        run: npm run prepare:ios --prefix native
      - name: Compile app and widget without signing
        run: >-
          xcodebuild -project native/ios/App/App.xcodeproj
          -scheme App -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath /tmp/daybuoy-ios
          CODE_SIGNING_ALLOWED=NO build
      - name: Save compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-evidence
          path: /tmp/daybuoy-ios/Logs/Build/
          retention-days: 14
