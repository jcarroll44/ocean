<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Breaking wave · Ocean</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1ef;color:#132e36;font:15px system-ui,-apple-system,sans-serif}main{height:100svh;display:flex;flex-direction:column}header{position:absolute;z-index:2;left:22px;top:18px;pointer-events:none}header p{margin:0 0 3px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:28px;font-weight:550;letter-spacing:-1px}iframe{display:block;width:100%;border:0;flex:1;min-height:0;background:#3a7487}.controls{background:#f7f8f5;padding:16px max(20px,calc((100vw - 760px)/2)) max(16px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px #223c4812}.line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.height-row{margin:10px 0 16px}.height-row output{font-size:22px;font-weight:600;width:76px}input{accent-color:#087478;flex:1;min-width:100px}button,a{border:1px solid #c8d6d3;border-radius:50px;padding:10px 16px;font:inherit;background:transparent;color:inherit;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#0b6066;border-color:#0b6066;color:white}#status{margin-left:auto;font-size:13px;color:#50706c}#download[hidden]{display:none}.secondary{font-size:12px;color:#60736f;margin:13px 0 0}#record{font-size:13px}@media(max-width:600px){header{left:16px}h1{font-size:23px}.controls{padding:13px 15px}.line{gap:7px}button,a{font-size:13px;padding:9px 12px}#status{width:100%;margin:0}.height-row{margin:7px 0 12px}}
</style></head><body><main><header><p>Ocean</p><h1>One breaking wave</h1></header><iframe src="app.html" id="scene" title="Adjustable breaking wave"></iframe><section class="controls"><div class="line"><button data-height="2">2 ft</button><button data-height="4" aria-pressed="true">4 ft</button><button data-height="6">6 ft</button><span id="status" role="status">Loading the scene…</span></div><div class="line height-row"><output id="height-value">4.0 ft</output><input type="range" id="height" aria-label="Wave height" min="1.5" max="6" step=".1" value="4"></div><div class="line"><button id="replay">Replay</button><button id="play">Pause</button><button id="compare">Watch 2 / 4 / 6</button><button id="view">Closer view</button><button id="record" disabled>Record 2 / 4 / 6 ft</button><a id="download" hidden>Download clip</a></div><p class="secondary">Visual wave study · height controls the individual wave · fixed camera · not a live forecast</p></section></main></body></html>
