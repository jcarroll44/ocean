<!doctype html><meta charset="utf-8"><title>BoBuoy render review</title><style>
body{margin:0;padding:16px;background:#e9eff2;color:#1a435a;font:14px system-ui}button{padding:10px;border:0;border-radius:24px;background:#1a435a;color:#fff;margin:4px;cursor:pointer}#layout{display:flex;gap:20px;align-items:start}iframe{width:390px;height:844px;border:0;flex-shrink:0}pre{white-space:pre-wrap;max-width:650px}#grid{display:grid;grid-template-columns:repeat(4,260px);gap:8px}#grid img{width:260px}#grid label{display:block}</style>
<h2>Preview: Sun travel and surf · simulated conditions for review</h2><div id="buttons"></div><div id="layout"><iframe id="app" src="app.html?static"></iframe><pre id="report">Loading test app…</pre></div><div id="grid"></div>
<script>
const app=document.querySelector('#app'),out=document.querySelector('#report'),buttons=document.querySelector('#buttons');let w,o,r;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const at=h=>Date.parse('2026-09-24T05:00:00Z')+h*3600000;
function render(){r.applyConditions(60);r.applySky();o.engine.setShear(0);o.engine.render(.05);r.updateHeader();r.updateTimeline();r.overlays();r.renderPanel(true);}
function sea(swell=6,wind=25,cloud=35,rain=0){o.state.sim={swell,wind,cloud,rain,visibility:rain?2200:24000,period:7,tide:.07,direction:201,windDirection:221,clarity:85};o.setTime(at(12));o.setDetent('peek');o.setView(0,-11*Math.PI/180,.84);r.uniforms.uTime.value=30;r.uniforms.uPhase.value=5;render();o.engine.reviewReset();for(let i=0;i<24;i++){r.uniforms.uTime.value+=.15;r.uniforms.uPhase.value+=.15/7;o.engine.render(.15);}w.document.querySelector('#loading').hidden=true;}
function report(x){out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2);}
function checkFrames(){const rows=[];for(const kind of ['day','evening']){o.startLapse(kind);const L=o.state.lapse;for(let i=0;i<25;i++){r.stepLapse(L.start+L.dur*i/24,.05);r.applySky();o.engine.setShear(0);const sun=r.skyAt(o.state.time).sun,p=o.engine.project(r.sceneVector(sun.azimuth,sun.altitude));const shore=o.engine.project(r.sceneVector(sun.azimuth,-18));rows.push({kind,f:i/24,alt:sun.altitude,x:p?.x,y:p?.y,shoreY:shore?.y,pass:p&&p.x>.08&&p.x<.92&&p.y>.04&&p.y<.93&&shore&&shore.y<.99});}o.stopLapse();}report({framingPass:rows.every(x=>x.pass),frames:rows.length,failures:rows.filter(x=>!x.pass),examples:rows.filter((x,i)=>i%12===0)});}
function pose(kind,f){if(o.state.lapse)o.stopLapse();o.startLapse(kind);const L=o.state.lapse;r.stepLapse(L.start+L.dur*f,.05);o.toggleLapse();render();report({kind,progress:f,time:new Date(o.state.time).toISOString(),camera:o.state.view});}
function add(name,fn){const b=document.createElement('button');b.textContent=name;b.onclick=async()=>{try{await fn()}catch(e){report(e.stack)}};buttons.append(b);}
app.onload=async()=>{w=app.contentWindow;for(let i=0;i<50&&!w.__ocean;i++)await wait(100);o=w.__ocean;r=w.__review;o.state.prefs.quality='low';o.engine.resize(390,844,.75);sea();report('Ready · 390 × 844 phone. Simulated sea and sky.');};
add('Check playback framing',checkFrames);
for(const [name,kind,f] of [['Sunrise','day',0],['Noon','day',.5],['Sunset','day',1],['Evening','evening',.75]])add(name,()=>pose(kind,f));
add('Golden hour',()=>{o.stopLapse();sea(.7,5,4);o.setTime(Date.parse('2026-09-23T22:50:00Z'));o.setView(25*Math.PI/180,-11*Math.PI/180,.84);render();report('September 23 · 5:50 PM · 0.7 ft / 5 kt · clear simulation');});
add('Rough',()=>{o.stopLapse();sea();report('6 ft · 25 kt · scattered');});add('Calm',()=>{o.stopLapse();sea(1,5,4);report('1 ft · 5 kt · clear');});add('Storm',()=>{o.stopLapse();sea(6,25,100,8);report('6 ft · 25 kt · storm');});
add('Animate',()=>{o.state.prefs.motion=true;w.location.href='app.html';});
add('Midnight',()=>{o.stopLapse();o.setTime(at(23.9));o.setView(0,-11*Math.PI/180,.84);render();report('Drag the handle across midnight');});
add('Phone interaction',()=>{app.src='app.html';report('Interactive preview');});
add('Build conditions grid',async()=>{o.stopLapse();document.querySelector('#grid').innerHTML='';w.document.querySelector('#app').style.visibility='hidden';w.document.querySelector('#ocean').style.visibility='visible';for(const [swell,wind] of [[1,5],[3,15],[6,25]])for(const [label,cloud,rain] of [['Clear',4,0],['Scattered',35,0],['Overcast',90,0],['Storm',100,8]]){sea(swell,wind,cloud,rain);const c=document.createElement('canvas');c.width=390;c.height=650;c.getContext('2d').drawImage(w.document.querySelector('#ocean'),0,0,390*.75,650*.75,0,0,390,650);const cell=document.createElement('div');cell.innerHTML=`<label>${swell} ft / ${wind} kt · ${label}</label>`;const img=new Image();img.src=c.toDataURL();cell.append(img);document.querySelector('#grid').append(cell);report(`${swell} ft / ${wind} kt · ${label}`);await wait(30);}w.document.querySelector('#app').style.visibility='';report('12 simulated conditions rendered');});
</script>
