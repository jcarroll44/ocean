<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DayBuoy native scene comparison</title>
<style>body{margin:0;background:#edf4f5;color:#17394d;font:16px system-ui}main{padding:18px}button,a{font:inherit}button{padding:12px;border:0;border-radius:9px;background:#17394d;color:white}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#controls{position:fixed;top:12px;left:12px;right:12px;z-index:2;background:#edf4f5ee;padding:12px;border-radius:10px}img{max-width:100%}p{line-height:1.4}</style>
<main><div id="controls"><button id="capture" disabled>Loading native scene…</button> <span id="status"></span></div><iframe id="stage" allow="webgpu" title="Fixed native beach"></iframe><img id="pair" hidden alt="Actual device screenshots: embedded proof reference and native DayBuoy scene"><p id="note" hidden></p><a id="download" hidden>Download screenshot pair</a></main>
<script type="module">
const $=id=>document.getElementById(id),stage=$('stage');stage.src='/?review=1&hour=12&ocean-profile=1&profile-pass=native&native-capture=1';
let armed=false;
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==stage.contentWindow||e.data?.type!=='daybuoy-profile')return;
 if(e.data.status==='failed'){$('status').textContent=e.data.reason;return;}
 if(e.data.status==='running'&&!armed){armed=true;$('capture').textContent='Capture proof / native';$('capture').disabled=false;$('status').textContent='Same ocean state and wave time. Capture is not an FPS test.';}
});
$('capture').onclick=async()=>{try{$('capture').disabled=true;$('status').textContent='Capturing both views…';const result=await stage.contentWindow.__tidewater.capturePair();const url=URL.createObjectURL(result.blob);$('pair').src=url;$('pair').hidden=false;$('download').href=url;$('download').download='daybuoy-native-proof-pair.png';$('download').hidden=false;$('note').textContent=result.metadata.note;$('note').hidden=false;stage.src='about:blank';stage.hidden=true;$('controls').hidden=true;}catch(e){$('status').textContent=e.message;$('capture').disabled=false;}};
</script></html>
