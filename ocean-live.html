<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DayBuoy · live phone recording</title>
<style>body{margin:0;font:15px system-ui;color:#17394d;background:#edf4f5}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#controls{position:relative;z-index:2;margin:10px;padding:12px;background:#edf4f5ef;border-radius:10px}button,a{font:inherit}button{padding:10px;border:0;border-radius:8px;background:#17394d;color:white}p{margin:8px 0}small{display:block}video{position:relative;z-index:3;max-width:100%;max-height:75vh;background:#000}#downloads a{display:inline-block;margin:8px}</style>
<iframe id="stage" src="/?ocean-debug=1" allow="webgpu" title="Today's live beach"></iframe>
<div id="controls"><button id="record" disabled>Measure FPS, then record 10 seconds</button> <button id="gate" disabled>Run live 120-second gate</button><p id="status">Loading current forecast…</p><small>Runs and sends results automatically. Keep this page open until Results sent. Clip: 20-second FPS check, then separate recording. Gate: 15-second warm-up, then 120 seconds without recording; every second must reach 30 GPU-completed FPS. Keep Safari visible. <a href="/?ocean-debug=1">Open live app</a></small><div id="downloads"></div></div>
<video id="video" controls playsinline hidden></video>
<p id="upload" role="status" style="position:relative;z-index:4;background:#edf4f5;padding:12px"></p>
<script type="module">
import {liveOcean,readLiveEvidence,measureLiveCadence,recordLiveCanvas} from './ocean-proof/proof/live-evidence.js';
import {newRunId,jsonFile,uploadEvidence,retryPending,captureScreenshot} from './ocean-proof/proof/results-upload.js';
const $=id=>document.getElementById(id),stage=$('stage');let busy=false,finished=false;
const query=new URLSearchParams(location.search),auto=query.get('run')!=='0',opened=Date.now();
const read=()=>{const e=readLiveEvidence(stage.contentWindow);if(e.native.revision!=='2026-10-08-overcast-1')throw Error('Waiting for the Oct 8 renderer. Reload this page if needed.');if(e.native.shoreFieldPending)throw Error('Updating shore direction and tide…');return e;};
const link=(blob,name,label)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.textContent=label;$('downloads').append(a);return a.href;};
async function run(seconds=20,initialError){
 if(busy)return;busy=true;finished=false;$('record').disabled=$('gate').disabled=true;
 const runId=newRunId(),files=[],report={schema:1,runId,kind:'live',startedAt:new Date().toISOString(),device:navigator.userAgent,seconds};
 try{
  await retryPending(text=>$('upload').textContent=text);
  if(initialError)throw Error(initialError);
  const before=report.before=read(),win=stage.contentWindow,size=[win.innerWidth,win.innerHeight],samples=[];let last=-Infinity;
  const validate=()=>{
   const e=readLiveEvidence(win);
   if(size[0]!==win.innerWidth||size[1]!==win.innerHeight)throw Error('Viewport changed. Rerun the live gate.');
   if(e.native.revision!=='2026-10-08-overcast-1'||e.native.post.aa!=='fxaa'||!e.native.post.flare)throw Error('Production settings changed. Rerun the live gate.');
   const now=performance.now();if(now-last>=1000){last=now;samples.push({at:now,conditions:e.conditions,dpr:e.native.quality.dpr,shoreFieldPending:e.native.shoreFieldPending});}return e;
  };
  const cadence=report.cadence=await measureLiveCadence(liveOcean(win),{validate,seconds,warmup:15,onProgress:text=>$('status').textContent=text});
  report.samples=samples;report.after=readLiveEvidence(win);
  for(let i=0;i<2;i++){try{files.push({name:`scene-${i+1}.png`,blob:await captureScreenshot(win)});}catch(e){(report.captureErrors??=[]).push({file:'screenshot',error:e.message});}}
  $('status').textContent=`${cadence.fps.toFixed(1)} GPU done/s before recording · recording 10 seconds…`;
  try{
   const clip=await recordLiveCanvas(win.__daybuoy.engine.getSceneCanvas(),{validate:()=>readLiveEvidence(win)});
   files.push({name:'clip.'+clip.extension,blob:clip.blob});report.clip={...clip,blob:undefined,scope:'Displayed scene canvas, recorded after FPS measurement.'};
   $('video').src=link(clip.blob,'daybuoy-live.'+clip.extension,'Download phone clip');$('video').hidden=false;
  }catch(e){(report.captureErrors??=[]).push({file:'clip',error:e.message});}
  $('status').textContent=`${cadence.fps.toFixed(1)} average · ${cadence.minOneSecondFPS} minimum GPU FPS. ${report.captureErrors?.length?'Some captures unavailable; details included in results.':''}`;
 }catch(e){report.error=e.message;$('status').textContent=e.message;}
 finally{
  report.finishedAt=new Date().toISOString();const file=jsonFile(report);link(file.blob,'daybuoy-live-evidence.json','Download conditions + FPS');
  stage.src='about:blank';stage.hidden=true;
  try{await uploadEvidence({runId,kind:'live',files:[file,...files]},text=>$('upload').textContent=text);}catch{}
  busy=false;finished=true;$('record').disabled=$('gate').disabled=false;
 }
}
$('record').onclick=()=>location.reload();
$('gate').onclick=()=>{const next=new URL(location.href);next.searchParams.set('gate','1');next.searchParams.delete('run');location.href=next;};
setInterval(()=>{if(busy||finished)return;try{const e=read(),c=e.conditions;$('record').disabled=$('gate').disabled=false;$('status').textContent=`Live · ${c.swell.toFixed(1)} ft / ${c.period.toFixed(1)} s · wind ${c.wind.toFixed(1)} kt · tide ${c.tide.toFixed(2)} m`;if(auto)void run(query.get('gate')==='1'?120:20);else $('record').onclick=()=>run(20);}catch(e){$('status').textContent=e.message;if(auto&&Date.now()-opened>180000)void run(20,e.message);}},1000);
</script></html>
